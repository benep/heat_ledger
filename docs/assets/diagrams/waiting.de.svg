<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <rect x="1" y="1" width="818" height="338" rx="14" fill="#f7f8fa" stroke="#e2e5ea"/>
  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Warum die Räume die Wärme später bekommen, als der Kessel sie erzeugt</text>

  <!-- Row labels -->
  <g font-size="14" font-weight="bold" fill="#333">
    <text x="20" y="88">Brenner</text>
    <text x="20" y="133">Heizkreis-</text><text x="20" y="149">pumpe</text>
    <text x="20" y="205">Wartende</text>
  </g>
  <text x="20" y="223" font-size="12" fill="#666">Wärme</text>

  <!-- Grid and time axis: x = 120 + hour × 82.5 -->
  <g stroke="#e2e5ea" stroke-width="1">
    <line x1="120" y1="60" x2="120" y2="262"/><line x1="285" y1="60" x2="285" y2="262"/>
    <line x1="450" y1="60" x2="450" y2="262"/><line x1="615" y1="60" x2="615" y2="262"/>
    <line x1="780" y1="60" x2="780" y2="262"/>
  </g>
  <line x1="120" y1="262" x2="780" y2="262" stroke="#9aa3ad" stroke-width="1.5"/>
  <g font-size="12.5" fill="#666" text-anchor="middle">
    <text x="120" y="282">0:00</text><text x="285" y="282">2:00</text><text x="450" y="282">4:00</text>
    <text x="615" y="282">6:00</text><text x="780" y="282">8:00</text>
  </g>

  <!-- Burner runs -->
  <g fill="#e4572e">
    <rect x="202.5" y="72" width="41.25" height="22" rx="3"/>
    <rect x="408.75" y="72" width="41.25" height="22" rx="3"/>
    <rect x="615" y="72" width="55" height="22" rx="3"/>
    <rect x="725" y="72" width="27.5" height="22" rx="3"/>
  </g>
  <!-- Circuit pump runs -->
  <rect x="615" y="117" width="165" height="22" rx="3" fill="#3a86ff"/>

  <!-- Heat waiting to be shared -->
  <polygon points="120,250 202.5,250 243.75,222 408.75,222 450,192 615,192 725,240 752.5,233 780,246 780,250" fill="#f4a261" fill-opacity="0.55" stroke="#e07a1f" stroke-width="2" stroke-linejoin="round"/>

  <g font-size="12.5" fill="#444" text-anchor="middle">
    <text x="420" y="168">Der Kessel heizt, die Pumpe steht:</text>
    <text x="420" y="184">die Wärme wartet</text>
    <text x="700" y="168">Die Pumpe läuft:</text>
    <text x="700" y="184">die Räume bekommen sie</text>
  </g>

  <text x="410" y="320" text-anchor="middle" font-size="13" fill="#555">Über den Tag geht alles auf: Was der Kessel erzeugt, landet in den Räumen oder im Warmwasser.</text>
</svg>
