site_name: Heat Ledger
site_description: Heat per room and for hot water, for the Energy dashboard of Home Assistant.
site_url: https://benep.github.io/heat_ledger/
repo_url: https://github.com/benep/heat_ledger
repo_name: benep/heat_ledger
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.footer
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: Wärme pro Raum und fürs Warmwasser, für das Energie-Dashboard von Home Assistant.
          nav_translations:
            Home: Start
            How it works: So funktioniert es
            Installation: Installation
            Setup: Einrichtung
            Energy dashboard: Energie-Dashboard
            More accurate: Genauer machen
            Questions: Häufige Fragen
            Development: Entwicklung
            Architecture: Architektur

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Installation: installation.md
  - Setup: setup.md
  - Energy dashboard: energy-dashboard.md
  - More accurate: more-accurate.md
  - Questions: faq.md
  - Development:
      - Architecture: architecture.md
      - Development: development.md
